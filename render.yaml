services:
  - type: web
    name: blog-artes-marciales
    runtime: static
    plan: free
    buildCommand: npm run build
    staticPublishPath: ./dist
    pullRequestPreviewsEnabled: true
    envVars:
      - key: NODE_VERSION
        value: 22.22.0
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /_astro/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
